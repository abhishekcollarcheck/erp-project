name: Deploy UNG-ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. PREPARE DEPLOYMENT PACKAGES
      # ==========================================

      - name: Prepare deployment packages
        run: |
          echo "Preparing backend package..."

          tar \
            --exclude='.git' \
            --exclude='backend/node_modules' \
            --exclude='backend/dist' \
            --exclude='backend/.env' \
            --exclude='backend/uploads' \
            -czf backend.tar.gz backend

          echo "Preparing frontend package..."

          tar \
            --exclude='.git' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.next' \
            --exclude='frontend/.env' \
            -czf frontend.tar.gz frontend

          echo "Packages created:"
          ls -lh backend.tar.gz frontend.tar.gz

      # ==========================================
      # 3. UPLOAD BACKEND
      # ==========================================

      - name: Upload backend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/tmp/ung-erp-deploy"

      # ==========================================
      # 4. UPLOAD FRONTEND
      # ==========================================

      - name: Upload frontend package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/tmp/ung-erp-deploy"

      # ==========================================
      # 5. DEPLOY TO EC2
      # ==========================================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting UNG-ERP deployment"
            echo "======================================"

            # ======================================
            # LOAD NVM
            # ======================================

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found at $NVM_DIR"
              exit 1
            fi

            echo "NVM loaded successfully"

            # Verify Node versions available
            echo "Available Node versions:"
            nvm ls

            # ======================================
            # PREPARE TEMP DIRECTORIES
            # ======================================

            rm -rf /tmp/ung-erp-deploy/backend
            rm -rf /tmp/ung-erp-deploy/frontend

            mkdir -p /tmp/ung-erp-deploy/backend
            mkdir -p /tmp/ung-erp-deploy/frontend

            # ======================================
            # BACKEND
            # ======================================

            echo ""
            echo "======================================"
            echo "Deploying Backend"
            echo "======================================"

            echo "Extracting backend package..."

            tar \
              -xzf /tmp/ung-erp-deploy/backend.tar.gz \
              -C /tmp/ung-erp-deploy/backend \
              --strip-components=1

            echo "Switching backend to Node 22.22.1..."

            nvm use 22.22.1

            echo "Backend Node:"
            node -v

            echo "Backend NPM:"
            npm -v

            # Safety check
            if [ "$(node -v)" != "v22.22.1" ]; then
              echo "ERROR: Backend is not using Node 22.22.1"
              exit 1
            fi

            echo "Syncing backend source..."

            rsync -a --delete \
              --exclude='.env' \
              --exclude='node_modules/' \
              --exclude='dist/' \
              --exclude='uploads/' \
              /tmp/ung-erp-deploy/backend/ \
              /var/www/api-erp/

            cd /var/www/api-erp

            echo "Installing backend dependencies..."

            npm ci

            echo "Running backend migrations..."

            npm run migrate

            echo "Building backend..."

            npm run build

            echo "Restarting backend PM2..."

            pm2 restart api-erp --update-env

            echo "Backend deployment completed successfully."

            # ======================================
            # FRONTEND
            # ======================================

            echo ""
            echo "======================================"
            echo "Deploying Frontend"
            echo "======================================"

            echo "Extracting frontend package..."

            tar \
              -xzf /tmp/ung-erp-deploy/frontend.tar.gz \
              -C /tmp/ung-erp-deploy/frontend \
              --strip-components=1

            echo "Switching frontend to Node 20.20.1..."

            nvm use 20.20.1

            echo "Frontend Node:"
            node -v

            echo "Frontend NPM:"
            npm -v

            # Safety check
            if [ "$(node -v)" != "v20.20.1" ]; then
              echo "ERROR: Frontend is not using Node 20.20.1"
              exit 1
            fi

            echo "Syncing frontend source..."

            rsync -a --delete \
              --exclude='.env' \
              --exclude='node_modules/' \
              --exclude='.next/' \
              /tmp/ung-erp-deploy/frontend/ \
              /var/www/erp/

            cd /var/www/erp

            echo "Installing frontend dependencies..."

            npm ci

            echo "Building frontend..."

            npm run build

            echo "Restarting frontend PM2..."

            pm2 restart ungerp-front --update-env

            echo "Frontend deployment completed successfully."

            # ======================================
            # CLEANUP
            # ======================================

            echo ""
            echo "Cleaning temporary deployment files..."

            rm -rf /tmp/ung-erp-deploy

            # ======================================
            # FINAL STATUS
            # ======================================

            echo ""
            echo "======================================"
            echo "UNG-ERP DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo ""
            echo "PM2 Status:"
            pm2 status